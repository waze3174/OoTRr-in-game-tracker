name: Build

# Tests the tool, builds the frozen folders for Windows and Linux (Steam Deck included), and checks that the
# prebuilt module is what module/ builds. A tag "v*" also attaches the two archives to a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c packaging/constraints.txt -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  module:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # The toolchain is pinned: another devkitA64 makes another binary. This is the image tagged 20260219.
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
      - name: Build module/ with the pinned toolchain
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          aarch64-none-elf-gcc --version | head -n1
          version=$(sed -n 's/.*embeds `\([^`]*\)`.*/\1/p' ootr_tracker/resources/SOURCE.md | head -n1)
          make -C module PACKAGE_VERSION="$version"
          sha256sum module/bin/subsdk7
      - name: Keep the build on the branch ci-subsdk7
        if: always() && github.event_name == 'push'
        run: |
          cp module/bin/subsdk7 /tmp/subsdk7
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan ci-subsdk7
          git rm -rfq .
          cp /tmp/subsdk7 subsdk7
          sha256sum subsdk7 > subsdk7.sha256
          git add subsdk7 subsdk7.sha256
          git commit -qm "module built by the pinned toolchain"
          git push -f origin ci-subsdk7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subsdk7
          path: module/bin/subsdk7
      - name: Compare it with the shipped binary
        run: |
          sha256sum module/bin/subsdk7 ootr_tracker/resources/subsdk7
          cmp module/bin/subsdk7 ootr_tracker/resources/subsdk7

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: packaging\build_windows.cmd
        shell: cmd
      - run: Compress-Archive -Path dist\OoTRr-in-game-tracker -DestinationPath OoTRr-in-game-tracker-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: OoTRr-in-game-tracker-windows-x64
          path: OoTRr-in-game-tracker-windows-x64.zip

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y python3-tk
      - run: packaging/build_linux.sh
        env:
          OOTR_TRACKER_VENV: ${{ runner.temp }}/venv
      - run: tar -C dist -czf OoTRr-in-game-tracker-linux-x64.tar.gz OoTRr-in-game-tracker
      - uses: actions/upload-artifact@v4
        with:
          name: OoTRr-in-game-tracker-linux-x64
          path: OoTRr-in-game-tracker-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, module]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          prerelease: true
